spring.application.name=switch-monetique-service
server.port=8090

# Base Oracle dediee au switch monetique (separee de la base SQL Server de demo)
spring.datasource.url=${SWITCH_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${SWITCH_DB_USERNAME:switch_monetique}
spring.datasource.password=${SWITCH_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Serveur ISO 8583 (canal TPE)
switch.iso8583.port=${SWITCH_ISO8583_PORT:10000}

# URL du projet demo pour les notifications webhook (optionnel)
app.demo.base-url=${APP_DEMO_BASE_URL:http://localhost:8000}
app.demo.internal-token=${MONETIQUE_INTERNAL_TOKEN:change-me-monetique-internal-token}
app.demo.signature-secret=${MONETIQUE_SIGNATURE_SECRET:change-me-monetique-signature-secret-32chars}
